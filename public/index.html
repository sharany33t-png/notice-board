<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Digital Notice Board</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1a1d29;--mute:#667;--line:#e3e5ee;--pri:#3b5bdb;--priInk:#fff;--red:#d6336c;--ok:#2b8a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--ink:#eceef6;--mute:#9aa0b8;--line:#2c3042;--pri:#748ffc;--priInk:#10131f;--red:#f06595;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--ink:#eceef6;--mute:#9aa0b8;--line:#2c3042;--pri:#748ffc;--priInk:#10131f;--red:#f06595;--ok:#69db7c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:18px;margin:0}nav{display:flex;gap:6px}
button,input,select,textarea{font:inherit;color:inherit}
nav button,.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer}
nav button.on,.btn.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.btn.red{color:var(--red)}.btn.sm{padding:4px 10px;font-size:14px}
main{max-width:960px;margin:0 auto;padding:16px}
.banner{background:var(--red);color:#fff;padding:8px 0;overflow:hidden;white-space:nowrap}
.banner span{display:inline-block;padding-left:100%;animation:scr 22s linear infinite;font-weight:600}
@keyframes scr{to{transform:translateX(-100%)}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:56vh;padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.stage h2{font-size:clamp(26px,5vw,52px);line-height:1.15;margin:0}
.stage p{font-size:clamp(17px,2.4vw,26px);margin:0;white-space:pre-wrap}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri);color:var(--priInk);align-self:flex-start}
.chip.urgent{background:var(--red);color:#fff}
.meta{color:var(--mute);font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:6px 0 4px;font-size:18px}.card p{margin:0;white-space:pre-wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.row input,.row select{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
form{display:grid;gap:10px;margin-bottom:20px}
form input,form select,form textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{padding:10px 14px;border-radius:10px;background:var(--card);border:1px dashed var(--line);color:var(--mute);margin-bottom:12px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.tools{display:flex;gap:6px;margin-top:8px}
body.kiosk header,body.kiosk .bar{display:none}
.mm{max-width:100%;max-height:62vh;object-fit:contain;display:block;margin:0 auto;border-radius:10px;background:#fff}
body.kiosk .mm{max-height:80vh}
.stage.media{min-height:0}.stage.media h2{font-size:clamp(20px,2.6vw,36px)}.stage.media p{font-size:clamp(15px,1.8vw,22px)}
</style>
</head>
<body>
<header>
  <h1>📌 Campus Notice Board</h1>
  <nav id="nav"></nav>
</header>
<div id="banner"></div>
<main id="app"></main>

<script>
(function(){
function tok(){return window._tok||(function(){try{return sessionStorage.getItem("nb-token")||""}catch(e){return ""}})()}
function hdr(){return{"Content-Type":"application/json","x-token":tok()}}
function chk(r){if(r.status===401){try{sessionStorage.setItem("nb-admin","0")}catch(e){}window._ok=false;alert("Session expired. Please log in again.");location.hash="admin";location.reload();throw 0}if(!r.ok)throw new Error("fail");return r}
var DB={
 collection:function(){return{
  onSnapshot:function(next,err){
   var last="";function load(){fetch("/api/notices").then(function(r){return r.json()}).then(function(l){var j=JSON.stringify(l);if(j===last)return;last=j;next({docs:l.map(function(n){return{id:n.id,data:function(){return n}}})})}).catch(function(){})}
   load();try{var es=new EventSource("/api/stream");es.onmessage=load}catch(e){setInterval(load,10000)}setInterval(load,60000)},
  doc:function(id){return{
   set:function(d){return fetch("/api/notices/"+encodeURIComponent(id),{method:"PUT",headers:hdr(),body:JSON.stringify(d)}).then(chk)},
   delete:function(){return fetch("/api/notices/"+encodeURIComponent(id),{method:"DELETE",headers:hdr()}).then(chk)}}}}},
 doc:function(){return{onSnapshot:function(next){next({exists:true,data:function(){return{hash:"server"}}})},set:function(){return Promise.resolve()}}}
};
window.claude={use:function(n){
 if(n==="db")return Promise.resolve(DB);
 if(n==="user")return Promise.resolve({can:function(){return true}});
 if(n==="downloads")return Promise.resolve({save:function(o){var a=document.createElement("a");a.href=URL.createObjectURL(o.data);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}});
 return Promise.resolve(null)}};
})();
</script>
<script>
(function(){
var CATS=["General","Civil","Mech","Mett","Exams","Events","Placements","Sports","Holidays"];
var LSK="notice-board-demo-v1";
var notices=[],view=(location.hash||"#board").slice(1),idx=0,db=null,canWrite=true,filter={q:"",cat:"All"},editing=null,usingDb=false,adminCfg=null,cfgReady=false,pendingFile=null,formDirty=false,pageIdx=0;

function el(t,a,k){var e=document.createElement(t);a=a||{};for(var x in a){if(x==="class")e.className=a[x];else if(x==="onclick")e.onclick=a[x];else e.setAttribute(x,a[x]);}(k||[]).forEach(function(c){e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function active(n){return !n.expires||n.expires>=today()}
function sorted(list){return list.slice().sort(function(a,b){return (b.priority==="urgent")-(a.priority==="urgent")||b.created-a.created})}
function fmt(ts){return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function uid(){return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- storage ---------- */
function lsLoad(){try{notices=JSON.parse(localStorage.getItem(LSK)||"[]")}catch(e){notices=[]}}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(notices))}catch(e){}}
function saveNotice(n){
  if(usingDb){return db.collection("notices").doc(n.id).set(n).catch(function(){alert("Could not save. Check your connection and log in again if needed.");return false})}
  var i=notices.findIndex(function(x){return x.id===n.id});if(i>=0)notices[i]=n;else notices.push(n);lsSave();render();return Promise.resolve();
}
function removeNotice(id){
  if(!confirm("Delete this notice?"))return;
  if(usingDb){db.collection("notices").doc(id).delete().catch(function(){alert("Could not delete.")});return}
  notices=notices.filter(function(x){return x.id!==id});lsSave();render();
}
function seed(){
  var now=Date.now(),s=[
   ["Mid-semester exams timetable released","Exams","normal","Timetable is on the department boards and the student portal. Report 15 minutes before each exam with your ID card."],
   ["Annual Tech Fest registrations open","Events","normal","Hackathon, robotics, and coding contests. Register at the student council desk before the last date."],
   ["Campus placement drive: Monday 10 AM","Placements","urgent","Final-year students must carry two copies of their resume. Formal dress code is mandatory."],
   ["Library closed on Saturday","General","normal","The library will be closed for stock verification. It reopens on Monday."]];
  s.forEach(function(x,i){saveNotice({id:uid(),title:x[0],category:x[1],priority:x[2],body:x[3],expires:"",created:now-i*3600000,author:"Admin"})});
}

/* ---------- views ---------- */
function setNav(){
  var nav=document.getElementById("nav");nav.textContent="";
  [["board","Board"],["notices","Notices"],["admin","Admin"]].forEach(function(p){
    nav.appendChild(el("button",{class:view===p[0]?"on":"",onclick:function(){go(p[0])}},[p[1]]))});
}
function go(v){view=v;location.hash=v;idx=0;lastKey="";formDirty=false;document.body.classList.remove("kiosk");render()}

function banner(){
  var b=document.getElementById("banner");b.textContent="";
  var u=notices.filter(function(n){return active(n)&&n.priority==="urgent"});
  if(!u.length)return;
  b.appendChild(el("div",{class:"banner"},[el("span",{},["🚨 "+u.map(function(n){return n.title}).join("   •   ")])]));
}

function board(app){
  var list=sorted(notices.filter(active));
  var bar=el("div",{class:"bar"},[el("span",{id:"clock"},[""]),el("button",{class:"btn sm",onclick:function(){
    document.body.classList.toggle("kiosk");try{if(document.body.classList.contains("kiosk"))document.documentElement.requestFullscreen()}catch(e){}}},["Kiosk mode"])]);
  app.appendChild(bar);
  if(!list.length){app.appendChild(el("div",{class:"stage"},[el("h2",{},["No active notices"]),el("p",{},["New announcements will appear here instantly."])]));return}
  if(idx>=list.length)idx=0;var n=list[idx];
  var st=el("div",{class:"stage"+(n.att?" media":"")},[
    el("span",{class:"chip"+(n.priority==="urgent"?" urgent":"")},[(n.priority==="urgent"?"URGENT · ":"")+n.category]),
    el("h2",{},[n.title]),el("p",{},[n.body||""]),boardMedia(n),
    el("div",{class:"meta"},["Posted "+fmt(n.created)+(n.expires?" · Valid until "+n.expires:"")])]);
  app.appendChild(st);
  var d=el("div",{class:"dots"});list.forEach(function(_,i){d.appendChild(el("i",{class:i===idx?"on":""}))});app.appendChild(d);
  tick();
}
function tick(){var c=document.getElementById("clock");if(c)c.textContent=new Date().toLocaleString(undefined,{weekday:"long",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}

function isPages(a){return !!a&&a.kind==="pages"}
function mediaUrl(n,i){return "/api/media/"+encodeURIComponent(n.id)+"/"+n.att.v+"/"+i}
function apiTok(){return window._tok||(function(){try{return sessionStorage.getItem("nb-token")||""}catch(e){return ""}})()}
function attach(n,mode){var a=n.att;if(!a)return "";
  if(isPages(a)){
    if(mode==="admin")return el("div",{class:"meta"},[el("img",{src:mediaUrl(n,0),alt:a.name,loading:"lazy",style:"max-height:120px;max-width:100%;border-radius:8px;display:block;margin:6px 0"}),"\uD83D\uDCCE "+a.name+" \u00B7 "+a.count+(a.count>1?" pages":" page")]);
    var box=el("div",{style:"display:grid;gap:10px;margin:10px 0"});
    for(var i=0;i<a.count;i++)box.appendChild(el("a",{href:mediaUrl(n,i),target:"_blank",rel:"noopener"},[el("img",{src:mediaUrl(n,i),alt:a.name+" page "+(i+1),loading:"lazy",style:"width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;display:block"})]));
    return box}
  if(a.type.indexOf("image/")===0)return el("img",{src:a.data,alt:a.name,style:"max-width:100%;max-height:40vh;border-radius:12px;object-fit:contain;align-self:flex-start;margin:8px 0"});
  return el("button",{class:"btn sm",style:"align-self:flex-start;margin:8px 0",onclick:function(){saveFile(a)}},["\uD83D\uDCCE "+a.name+" (download)"])}
function boardMedia(n){var a=n.att;if(!a)return "";
  if(isPages(a)){var pg=Math.min(pageIdx,a.count-1);
    var w=el("div",{style:"display:flex;flex-direction:column;align-items:center;gap:8px"},[el("img",{class:"mm",src:mediaUrl(n,pg),alt:a.name})]);
    if(a.count>1)w.appendChild(el("div",{class:"meta"},["Page "+(pg+1)+" of "+a.count]));
    for(var i=0;i<a.count;i++){var im=new Image();im.src=mediaUrl(n,i)}
    return w}
  if(a.type&&a.type.indexOf("image/")===0)return el("img",{class:"mm",src:a.data,alt:a.name});
  return attach(n,"board")}
function loadPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise(function(ok,no){var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  s.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok()};
  s.onerror=function(){no(new Error("Could not load the PDF reader. Check your internet connection."))};document.head.appendChild(s)})}
function toJpeg(cv){var q=0.8,u=cv.toDataURL("image/jpeg",q);while(u.length>880000&&q>0.35){q-=0.1;u=cv.toDataURL("image/jpeg",q)}
  if(u.length>880000)throw new Error("An image or page is too detailed to store. Try a simpler or smaller file.");return u}
function prepFile(f,prog){
  if(f.size>15*1024*1024)return Promise.reject(new Error("File is too large (maximum 15 MB)."));
  if(f.type.indexOf("image/")===0)return new Promise(function(ok,no){var r=new FileReader();r.onerror=function(){no(new Error("Could not read the file."))};
    r.onload=function(){var im=new Image();im.onerror=function(){no(new Error("Unsupported image."))};
      im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        try{ok({name:f.name,pages:[toJpeg(c)],isNew:true})}catch(e){no(e)}};
      im.src=r.result};r.readAsDataURL(f)});
  if(f.type==="application/pdf")return loadPdfJs().then(function(){return f.arrayBuffer()}).then(function(buf){return pdfjsLib.getDocument({data:buf}).promise}).then(function(pdf){
    var n=Math.min(pdf.numPages,20),out=[],p=Promise.resolve();
    function one(i){return pdf.getPage(i).then(function(pg){var v=pg.getViewport({scale:1}),sc=Math.min(3,1600/Math.max(v.width,v.height)),vp=pg.getViewport({scale:sc}),c=document.createElement("canvas");
      c.width=Math.round(vp.width);c.height=Math.round(vp.height);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
      return pg.render({canvasContext:x,viewport:vp}).promise.then(function(){out.push(toJpeg(c));prog("Reading PDF page "+i+" of "+n+"\u2026")})})}
    for(var i=1;i<=n;i++)(function(k){p=p.then(function(){return one(k)})})(i);
    return p.then(function(){return{name:f.name,pages:out,isNew:true,note:pdf.numPages>20?" (only the first 20 pages are used)":""}})});
  return Promise.reject(new Error("Only images and PDFs are supported."))}
function saveFile(a){try{var s=atob(a.data.split(",")[1]),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);var blob=new Blob([u],{type:a.type});
  window.claude.use("downloads").then(function(d){if(d)d.save({filename:a.name,data:blob}).catch(function(){});else alert("Download isn’t available in this view.")})}catch(e){alert("Could not open the file.")}}
function readFile(f){return new Promise(function(ok,no){var r=new FileReader();r.onerror=function(){no("Could not read the file.")};
  r.onload=function(){var d=r.result;
   if(f.type.indexOf("image/")===0){var im=new Image();im.onerror=function(){no("Unsupported image.")};
    im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
     var q=0.75,u=c.toDataURL("image/jpeg",q);while(u.length>190000&&q>0.3){q-=0.1;u=c.toDataURL("image/jpeg",q)}
     if(u.length>190000)no("Image is too large even after shrinking. Try a smaller one.");else ok({name:f.name.replace(/\.[^.]+$/,"")+".jpg",type:"image/jpeg",data:u})};
    im.src=d}
   else if(f.type==="application/pdf"){if(d.length>190000)no("PDF is too large (limit about 140 KB). Compress it or attach a screenshot instead.");else ok({name:f.name,type:f.type,data:d})}
   else no("Only images and PDFs are supported.")};
  r.readAsDataURL(f)})}
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode("nb:"+s)).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function unlocked(){if(window._ok)return true;try{return sessionStorage.getItem("nb-admin")==="1"}catch(e){return false}}
function setUnlocked(v){window._ok=v;try{sessionStorage.setItem("nb-admin",v?"1":"0")}catch(e){}}
function gate(app){
  if(!cfgReady){app.appendChild(el("div",{class:"empty"},["Loading…"]));return}
  var first=!adminCfg||!adminCfg.hash;
  var p=el("input",{type:"password",placeholder:first?"Create admin password (min 6 characters)":"Admin password"});
  var p2=first?el("input",{type:"password",placeholder:"Confirm password"}):"";
  var msg=el("div",{class:"meta",style:"color:var(--red)"});
  var f=el("form",{style:"max-width:380px;margin:40px auto"},[el("h3",{},[first?"Set up admin access":"🔒 Admin login"]),
   el("div",{class:"meta"},[first?"Only staff who post notices need this. Students can view the Board and Notices without a password.":"Enter the password to post or manage notices."]),p,p2,msg,
   el("button",{class:"btn pri",type:"submit"},[first?"Create password":"Unlock"])]);
  f.onsubmit=function(ev){ev.preventDefault();var v=p.value;
   if(first){if(v.length<6){msg.textContent="Use at least 6 characters.";return}if(v!==p2.value){msg.textContent="Passwords don’t match.";return}}
   fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:v})})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
    .then(function(r){if(r.ok){try{sessionStorage.setItem("nb-token",r.j.token)}catch(e){}window._tok=r.j.token;setUnlocked(true);render()}else msg.textContent="Wrong password."})
    .catch(function(){msg.textContent="Server not reachable."})};
  app.appendChild(f)}

function card(n,tools){
  var c=el("div",{class:"card"},[
    el("span",{class:"chip"+(n.priority==="urgent"?" urgent":"")},[(n.priority==="urgent"?"URGENT · ":"")+n.category]),
    el("h3",{},[n.title]),el("p",{},[n.body||""]),attach(n,tools?"admin":"card"),
    el("div",{class:"meta"},["Posted "+fmt(n.created)+(n.expires?" · Valid until "+n.expires:" · No expiry")+(active(n)?"":" · EXPIRED")])]);
  if(tools)c.appendChild(tools);return c;
}

function pushCard(){
  var box=el("div",{class:"card"}),st=el("div",{class:"meta"});
  box.appendChild(el("h3",{},["\uD83D\uDD14 Get notified"]));
  if(!("serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window)){
    box.appendChild(el("p",{},["This browser doesn\u2019t support notifications. On iPhone, add this site to your Home Screen and open it from there."]));return box}
  var checks=[],list=el("div",{style:"display:flex;flex-wrap:wrap;gap:10px;margin:10px 0"});
  ["All"].concat(CATS).forEach(function(c){var cb=el("input",{type:"checkbox",value:c,style:"width:auto"});if(c==="All")cb.checked=true;checks.push(cb);list.appendChild(el("label",{style:"display:flex;gap:6px;align-items:center"},[cb,c]))});
  var btn=el("button",{class:"btn pri"},["Enable notifications"]),off=el("button",{class:"btn",style:"display:none"},["Turn off"]);
  function sel(){var s=checks.filter(function(c){return c.checked}).map(function(c){return c.value});return s.indexOf("All")>=0?["All"]:s}
  function u8(b){var p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
  function show(on){btn.textContent=on?"Update categories":"Enable notifications";off.style.display=on?"":"none";if(on)st.textContent="Notifications are ON for this device."}
  navigator.serviceWorker.register("/sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(r){return r.pushManager.getSubscription()}).then(function(s){show(!!s)}).catch(function(){});
  btn.onclick=function(){var cats=sel();if(!cats.length){st.textContent="Pick at least one category.";return}
    st.textContent="Working\u2026";
    Notification.requestPermission().then(function(p){if(p!=="granted")throw new Error("Permission denied. Allow notifications for this site in your browser settings.");return navigator.serviceWorker.register("/sw.js")})
    .then(function(){return navigator.serviceWorker.ready})
    .then(function(reg){return fetch("/api/push/key").then(function(r){return r.json()}).then(function(k){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(k.key)})})})})
    .then(function(sub){return fetch("/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub,cats:cats})})})
    .then(function(r){if(!r.ok)throw new Error("Server error. Try again.");show(true);st.textContent="Done! You will get alerts for: "+cats.join(", ")})
    .catch(function(e){st.textContent=e.message||"Could not enable notifications."})};
  off.onclick=function(){navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){if(!s)return;fetch("/api/push/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:s.endpoint})});return s.unsubscribe()}).then(function(){show(false);st.textContent="Notifications turned off."})};
  box.appendChild(el("p",{},["Choose what you want alerts for. You will get a pop-up on this device when a new notice is posted."]));
  box.appendChild(list);box.appendChild(el("div",{class:"tools"},[btn,off]));box.appendChild(st);return box}

function notice(app){
  var q=el("input",{placeholder:"Search notices…",value:filter.q});
  var cat=el("select",{},["All"].concat(CATS).map(function(c){var o=el("option",{value:c},[c]);if(c===filter.cat)o.selected=true;return o}));
  var out=el("div");
  function draw(){
    out.textContent="";
    var l=sorted(notices.filter(active)).filter(function(n){
      return (filter.cat==="All"||n.category===filter.cat)&&(!filter.q||(n.title+" "+n.body).toLowerCase().indexOf(filter.q.toLowerCase())>=0)});
    if(!l.length)out.appendChild(el("div",{class:"empty"},["No notices found."]));
    l.forEach(function(n){out.appendChild(card(n))});
  }
  q.oninput=function(){filter.q=q.value;draw()};cat.onchange=function(){filter.cat=cat.value;draw()};
  app.appendChild(pushCard());
  app.appendChild(el("div",{class:"row"},[q,cat]));app.appendChild(out);draw();
}

function admin(app){
  if(!unlocked())return gate(app);
  formDirty=false;
  app.appendChild(el("div",{class:"bar"},[el("span",{},["Signed in as admin"]),el("button",{class:"btn sm",onclick:function(){setUnlocked(false);render()}},["Log out"])]));
  if(!usingDb)app.appendChild(el("div",{class:"note"},["Demo mode: notices are saved only in this browser. When opened as a published artifact, notices are stored in the shared database and update live on every screen."]));
  if(!canWrite){app.appendChild(el("div",{class:"note"},["You have view-only access. Ask the owner for edit access to post notices."]))}
  else{
    var e=editing?notices.find(function(x){return x.id===editing}):null;
    var t=el("input",{placeholder:"Title",required:"required",maxlength:"120",value:e?e.title:""});
    var b=el("textarea",{placeholder:"Notice details",rows:"4",maxlength:"1500"});b.value=e?e.body:"";
    var c=el("select",{},CATS.map(function(x){var o=el("option",{value:x},[x]);if(e&&e.category===x)o.selected=true;return o}));
    var p=el("select",{},[["normal","Normal"],["urgent","Urgent"]].map(function(x){var o=el("option",{value:x[0]},[x[1]]);if(e&&e.priority===x[0])o.selected=true;return o}));
    var x=el("input",{type:"date",value:e?e.expires:""});
    var du=el("select",{},[3,5,8,10,15,20,30,45,60].map(function(s){var o=el("option",{value:String(s)},[s+" seconds"]);if(((e&&e.duration)||8)===s)o.selected=true;return o}));
    pendingFile=e&&e.att?e.att:null;
    var fs=el("div",{class:"meta"},[pendingFile?"Current: "+pendingFile.name:"No attachment"]);
    var fi=el("input",{type:"file",accept:"image/*,application/pdf"});
    fi.onchange=function(){var fl=fi.files[0];if(!fl)return;fs.textContent="Processing\u2026";prepFile(fl,function(m){fs.textContent=m}).then(function(a){pendingFile=a;fs.textContent="Ready: "+a.name+" ("+a.pages.length+(a.pages.length>1?" pages":" page")+")"+(a.note||"")+". It will upload when you press Publish."}).catch(function(m){pendingFile=e&&e.att?e.att:null;fi.value="";fs.textContent=(m&&m.message)||String(m)})};
    var rm=el("button",{class:"btn sm",type:"button",onclick:function(){pendingFile=null;fi.value="";fs.textContent="No attachment"}},["Remove attachment"]);
    var f=el("form",{},[el("h3",{},[e?"Edit notice":"Post a new notice"]),t,b,el("div",{class:"two"},[c,p]),
      el("label",{class:"meta"},["Expiry date (optional): the notice disappears automatically after this day"]),x,
      el("label",{class:"meta"},["How long this notice stays on the Board (for a PDF: how long each page stays)"]),du,
      el("label",{class:"meta"},["Attachment (optional): an image or a PDF (up to 20 pages). It is shown large and readable on the Board, and PDF pages play as a slideshow."]),fi,fs,rm,
      el("div",{class:"tools"},[el("button",{class:"btn pri",type:"submit"},[e?"Save changes":"Publish"]),
        e?el("button",{class:"btn",type:"button",onclick:function(){editing=null;render()}},["Cancel"]):""])]);
    f.oninput=f.onchange=function(){formDirty=true};
    f.onsubmit=function(ev){ev.preventDefault();
      var n=e?Object.assign({},e):{id:uid(),created:Date.now(),author:"Admin"};
      n.title=t.value.trim();n.body=b.value.trim();n.category=c.value;n.priority=p.value;n.expires=x.value;n.duration=Number(du.value)||8;
      if(!n.title)return;
      var sb=f.querySelector("button[type=submit]");sb.disabled=true;
      var done=function(ok){sb.disabled=false;if(ok===false)return;editing=null;formDirty=false;go("board")};
      var finish=function(){return saveNotice(n).then(done)};
      if(pendingFile&&pendingFile.isNew){
        var v=Date.now(),pf=pendingFile,i=0;
        var up=function(){if(i>=pf.pages.length)return Promise.resolve();fs.textContent="Uploading page "+(i+1)+" of "+pf.pages.length+"\u2026";
          return fetch("/api/notices/"+encodeURIComponent(n.id)+"/media/"+v+"/"+i,{method:"POST",headers:{"Content-Type":"application/json","x-token":apiTok()},body:JSON.stringify({data:pf.pages[i]})})
            .then(function(r){if(!r.ok)throw new Error(r.status===401?"Session expired. Please log in again.":"Upload failed. Try again.");i++;return up()})};
        up().then(function(){n.att={name:pf.name,kind:"pages",v:v,count:pf.pages.length};return finish()})
          .catch(function(err){sb.disabled=false;fs.textContent=err.message||"Upload failed."});
      }else{if(pendingFile)n.att=pendingFile;else delete n.att;finish()}};
    app.appendChild(f);
  }
  app.appendChild(el("h3",{},["All notices ("+notices.length+")"]));
  if(!notices.length&&canWrite)app.appendChild(el("button",{class:"btn",onclick:seed},["Add sample notices"]));
  sorted(notices).forEach(function(n){
    var tl=canWrite?el("div",{class:"tools"},[el("button",{class:"btn sm",onclick:function(){editing=n.id;render();window.scrollTo(0,0)}},["Edit"]),el("button",{class:"btn sm red",onclick:function(){removeNotice(n.id)}},["Delete"])]):null;
    app.appendChild(card(n,tl));
  });
}

function refresh(){if(view==="admin"&&formDirty)return;render()}
function render(){
  setNav();banner();
  var app=document.getElementById("app");app.textContent="";
  if(view==="notices")notice(app);else if(view==="admin")admin(app);else board(app);
}

/* ---------- boot ---------- */
window.addEventListener("hashchange",function(){var v=(location.hash||"#board").slice(1);if(["board","notices","admin"].indexOf(v)>=0&&v!==view){view=v;formDirty=false;render()}});
var shownAt=Date.now(),lastKey="";
setInterval(function(){
  if(view!=="board")return;
  var l=sorted(notices.filter(active));if(!l.length)return;
  if(idx>=l.length)idx=0;
  var n=l[idx];if(n.id!==lastKey){lastKey=n.id;shownAt=Date.now();pageIdx=0}
  var d=Math.max(3,Math.min(120,Number(n.duration)||8)),pc=isPages(n.att)?Math.max(1,n.att.count):1,el_=Date.now()-shownAt;
  if(l.length>1&&el_>=d*pc*1000){idx=(idx+1)%l.length;pageIdx=0;render();return}
  if(pc>1){var np=Math.floor(el_/(d*1000))%pc;if(np!==pageIdx){pageIdx=np;render()}}
},500);
setInterval(tick,30000);
// midnight expiry refresh
setInterval(function(){if(view!=="admin")render()},600000);

lsLoad();try{adminCfg=JSON.parse(localStorage.getItem(LSK+"-pw")||"null")}catch(e){}cfgReady=true;render();
try{
  Promise.all([window.claude?window.claude.use("db"):null,window.claude?window.claude.use("user"):null]).then(function(r){
    if(!r[0])return;db=r[0];usingDb=true;notices=[];cfgReady=false;adminCfg=null;
    db.doc("config/admin").onSnapshot(function(s){adminCfg=s.exists?s.data():null;cfgReady=true;render()},function(){cfgReady=true;render()});
    if(r[1]){var w=r[1].can("data.write");if(w===false)canWrite=false}
    db.collection("notices").onSnapshot(function(s){notices=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});refresh()},function(){usingDb=false;lsLoad();render()});
  }).catch(function(){});
}catch(e){}
})();
</script>
